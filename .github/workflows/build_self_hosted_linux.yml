name: hutb Linux CI/CD
on:
   pull_request:
   workflow_dispatch:
jobs:
    linux-dev:
             name: Linux CI/CD
             timeout-minutes: 1440
             runs-on: self-hosted:linux
             env:
                UE4_ROOT: ${{ github.workspace }}
             steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5
                    with:
                         fetch-depth: 0
                  - name: build
                    run: |
                       ./Build.sh --git-code T8w6TYB_r71gGTP3A02B
                    shell: bash
                  - name: install
                    run: |
                       ./RunUAT.sh
                    shell: bash
                  - uses: mickem/clean-after-action@v1
                  - name: Delete .git folder
                    run: |
                        rm -rf .git
                    shell: bash
